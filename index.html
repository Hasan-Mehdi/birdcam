<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bird Cam</title>
<style>
  :root {
    /* Discord's insets on phones; the browser's own outside Discord */
    --sait: var(--discord-safe-area-inset-top, env(safe-area-inset-top, 0px));
    --saib: var(--discord-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    --sail: var(--discord-safe-area-inset-left, env(safe-area-inset-left, 0px));
  }
  html, body { margin: 0; height: 100%; background: #0b1114; }
  video { width: 100%; height: 100%; object-fit: contain; background: #0b1114; display: block; }
  #status { position: fixed; left: calc(12px + var(--sail)); bottom: calc(10px + var(--saib));
            font: 13px/1.3 system-ui, sans-serif; color: #9fb8bf; background: rgba(11,17,20,.7);
            padding: 4px 8px; border-radius: 4px; }
  #status:empty { display: none; }
  #down { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 8px; padding: var(--sait) 16px calc(var(--saib) + 8vh);
          text-align: center; font-family: system-ui, sans-serif; color: #e8e4da;
          background: #0a0f1a url(sleep.png) 22% center / cover no-repeat; image-rendering: pixelated; }
  #down[hidden] { display: none; }
  /* phone portrait: crop to the feeder, pole right of the text, text between camera and tray */
  @media (max-aspect-ratio: 1/1) { #down { background-position: 0% center; padding-bottom: calc(var(--saib) + 18vh); } }
  #down h1 { margin: 0; font-size: clamp(20px, 5vw, 34px); font-weight: 600; text-shadow: 0 2px 0 #05080e; }
  #down p { margin: 0; font-size: clamp(13px, 3vw, 17px); color: #b9c6d3; text-shadow: 0 1px 0 #05080e; }
  #down b { color: #e8a33d; font-weight: 600; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<div id="down" hidden><h1 id="downTitle"></h1><p id="downText"></p></div>
<div id="status">Connecting…</div>
<script src="sdk.js"></script>
<script src="hls.min.js"></script>
<script>
const CLIENT_ID = "1565868046797508628";
const SRC = "cam/index.m3u8";   // Discord's /cam URL mapping sends this to the Pi
// The Pi is on 8:00-18:00 New York time (Witty Pi schedule, pi-setup/schedules/daytime-0800-1800.wpi)
const WAKE = 8, SLEEP = 18, TZ = "America/New_York";
const video = document.getElementById("v");
const status = document.getElementById("status");
const down = document.getElementById("down");
const say = t => { status.textContent = t; };

// Inside Discord the SDK handshake tells the client the Activity is up; in a plain
// browser (testing) there are no frame parameters, so it is skipped.
if (new URLSearchParams(location.search).has("frame_id")) {
  try { new window.DiscordSDK(CLIENT_ID).ready().catch(e => console.warn("sdk", e)); }
  catch (e) { console.warn("sdk", e); }
}

function minutesInNewYork() {
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", minute: "numeric",
                                                    hourCycle: "h23" }).formatToParts(new Date());
  const get = type => +parts.find(p => p.type === type).value;
  return get("hour") * 60 + get("minute");
}

// No stream: say whether the Pi is asleep (with when it wakes, in the viewer's own time) or
// should be up. The page itself is hosted off the Pi, so this shows even while it's off.
function showDown() {
  const m = minutesInNewYork(), title = document.getElementById("downTitle"), text = document.getElementById("downText");
  if (m < WAKE * 60 || m >= SLEEP * 60) {
    const wait = (WAKE * 60 - m + 1440) % 1440;
    const at = new Date(Date.now() + wait * 60000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const left = wait >= 60 ? `${Math.floor(wait / 60)} h ${wait % 60} min` : `${wait} min`;
    title.textContent = "The bird cam is asleep";
    text.innerHTML = `It wakes at <b>${at}</b>, in ${left}.`;
  } else if (m < WAKE * 60 + 10) {
    title.textContent = "The bird cam is waking up";
    text.textContent = "Back in a minute or two.";
  } else {
    title.textContent = "The bird cam is offline";
    text.textContent = "Trying again…";
  }
  down.hidden = false;
  say("");
}
setInterval(() => { if (!down.hidden) showDown(); }, 30000);

// short stalls are normal through Discord's proxy; only say so if one lasts
let stall = null, playing = false;
video.addEventListener("playing", () => { playing = true; clearTimeout(stall); down.hidden = true; say(""); });
video.addEventListener("waiting", () => { clearTimeout(stall); stall = setTimeout(() => down.hidden && say("Buffering…"), 1500); });

async function start() {
  playing = false;
  // Ask for the playlist ourselves first: with the Pi off, Discord's proxy answers 525 and
  // hls.js retries a 5xx quietly for minutes without telling the page.
  try {
    const r = await fetch(SRC, { cache: "no-store" });
    if (!r.ok) throw new Error(`playlist ${r.status}`);
  } catch (e) {
    showDown();
    setTimeout(start, 20000);
    return;
  }
  if (window.Hls && Hls.isSupported()) {
    // No worker: the Activity's content policy may not allow blob: workers.
    // Whole segments with a 3-segment cushion: low-latency parts (~0.3 s each, ~0.2 s
    // per request through Discord's proxy and the Funnel relay) kept stalling.
    const hls = new Hls({ enableWorker: false, lowLatencyMode: false, liveSyncDurationCount: 3,
                          manifestLoadingMaxRetry: 30, manifestLoadingRetryDelay: 2000 });
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (playing) say("Reconnecting…");
      hls.destroy(); setTimeout(start, 3000);   // start() checks again and shows why if it's down
    });
    hls.loadSource(SRC);
    hls.attachMedia(video);
  } else {
    video.src = SRC;  // Safari / iOS play HLS natively
    video.addEventListener("error", () => { showDown(); setTimeout(start, 20000); }, { once: true });
  }
  video.play().catch(() => {});
}
start();
</script>
</body>
</html>
