<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bird Cam</title>
<style>
  :root {
    /* Discord's insets on phones; the browser's own outside Discord */
    --sait: var(--discord-safe-area-inset-top, env(safe-area-inset-top, 0px));
    --saib: var(--discord-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    --sail: var(--discord-safe-area-inset-left, env(safe-area-inset-left, 0px));
  }
  html, body { margin: 0; height: 100%; background: #0b1114; }
  video { width: 100%; height: 100%; object-fit: contain; background: #0b1114; display: block; }
  #status { position: fixed; left: calc(12px + var(--sail)); bottom: calc(10px + var(--saib));
            font: 13px/1.3 system-ui, sans-serif; color: #9fb8bf; background: rgba(11,17,20,.7);
            padding: 4px 8px; border-radius: 4px; }
  #status:empty { display: none; }
  #info { position: fixed; left: calc(12px + var(--sail)); bottom: calc(40px + var(--saib)); max-width: 90vw;
          font: 11px/1.35 ui-monospace, Consolas, monospace; color: #b9c6d3; white-space: pre-wrap;
          background: rgba(11,17,20,.8); padding: 6px 8px; border-radius: 4px; }
  #info:empty { display: none; }
  #down { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 8px; padding: var(--sait) 16px calc(var(--saib) + 8vh);
          text-align: center; font-family: system-ui, sans-serif; color: #e8e4da;
          background: #0a0f1a url(sleep.png) 22% center / cover no-repeat; image-rendering: pixelated; }
  #down[hidden] { display: none; }
  /* phone portrait: crop to the feeder, pole right of the text, text between camera and tray */
  @media (max-aspect-ratio: 1/1) { #down { background-position: 0% center; padding-bottom: calc(var(--saib) + 18vh); } }
  #down h1 { margin: 0; font-size: clamp(20px, 5vw, 34px); font-weight: 600; text-shadow: 0 2px 0 #05080e; }
  #down p { margin: 0; font-size: clamp(13px, 3vw, 17px); color: #b9c6d3; text-shadow: 0 1px 0 #05080e; }
  #down b { color: #e8a33d; font-weight: 600; }
  #tap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
         background: rgba(6,9,14,.45); border: 0; padding: 0; cursor: pointer; }
  #tap[hidden] { display: none; }
  #tap span { font: 600 17px/1 system-ui, sans-serif; color: #171207; background: #e8a33d;
              padding: 14px 22px; border-radius: 999px; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<button id="tap" hidden><span>&#9654; Tap to watch</span></button>
<div id="down" hidden><h1 id="downTitle"></h1><p id="downText"></p></div>
<div id="status">Connecting…</div>
<div id="info"></div>
<script src="sdk.js"></script>
<script src="hls.min.js"></script>
<script>
const CLIENT_ID = "1565868046797508628";
const SRC = "cam/index.m3u8";   // Discord's /cam URL mapping sends this to the Pi
// The Pi is on 8:00-18:00 New York time (Witty Pi schedule, pi-setup/schedules/daytime-0800-1800.wpi)
const WAKE = 8, SLEEP = 18, TZ = "America/New_York";
const video = document.getElementById("v");
const status = document.getElementById("status");
const down = document.getElementById("down");
const say = t => { status.textContent = t; };

// Inside Discord the SDK handshake tells the client the Activity is up; in a plain
// browser (testing) there are no frame parameters, so it is skipped.
if (new URLSearchParams(location.search).has("frame_id")) {
  try { new window.DiscordSDK(CLIENT_ID).ready().catch(e => console.warn("sdk", e)); }
  catch (e) { console.warn("sdk", e); }
}

function minutesInNewYork() {
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", minute: "numeric",
                                                    hourCycle: "h23" }).formatToParts(new Date());
  const get = type => +parts.find(p => p.type === type).value;
  return get("hour") * 60 + get("minute");
}

// No stream: say whether the Pi is asleep (with when it wakes, in the viewer's own time) or
// should be up. The page itself is hosted off the Pi, so this shows even while it's off.
function showDown() {
  const m = minutesInNewYork(), title = document.getElementById("downTitle"), text = document.getElementById("downText");
  if (m < WAKE * 60 || m >= SLEEP * 60) {
    const wait = (WAKE * 60 - m + 1440) % 1440;
    const at = new Date(Date.now() + wait * 60000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const left = wait >= 60 ? `${Math.floor(wait / 60)} h ${wait % 60} min` : `${wait} min`;
    title.textContent = "The bird cam is asleep";
    text.innerHTML = `It wakes at <b>${at}</b>, in ${left}.`;
  } else if (m < WAKE * 60 + 10) {
    title.textContent = "The bird cam is waking up";
    text.textContent = "Back in a minute or two.";
  } else {
    title.textContent = "The bird cam is offline";
    text.textContent = "Trying again…";
  }
  down.hidden = false;
  say("");
}
setInterval(() => { if (!down.hidden) showDown(); }, 30000);

// short stalls are normal through Discord's proxy; only say so if one lasts
let stall = null, playing = false;
video.addEventListener("playing", () => { playing = true; clearTimeout(stall); down.hidden = true; tap.hidden = true; say(""); });
video.addEventListener("waiting", () => { clearTimeout(stall); stall = setTimeout(() => down.hidden && tap.hidden && say("Buffering…"), 1500); });

// Android's in-app browser (Discord's mobile app) can refuse to start even a muted video
// without a tap; offer one instead of sitting on "Buffering…".
const tap = document.getElementById("tap");
function play() {
  video.play().then(() => { diag.play = "ok"; tap.hidden = true; }).catch(e => {
    diag.play = e.name;
    if (e.name === "NotAllowedError") { tap.hidden = false; clearTimeout(stall); say(""); }
  });
}
document.addEventListener("click", () => { if (!playing) play(); });

// If the video hasn't started 10 s in, show what the player sees, so a screenshot from a
// phone (where there are no dev tools) says why.
const diag = { started: 0, frags: 0, err: "", play: "" }, info = document.getElementById("info");
setInterval(() => {
  if (playing || !down.hidden || Date.now() - diag.started < 10000) { info.textContent = ""; return; }
  const b = video.buffered, mode = window.Hls && Hls.isSupported() ? "mse" : "native";
  info.textContent = [`hls ${window.Hls ? Hls.version : "-"} ${mode}  ready ${video.readyState} net ${video.networkState} paused ${video.paused} t ${video.currentTime.toFixed(1)}`,
    `buffered ${b.length ? b.start(0).toFixed(1) + "-" + b.end(b.length - 1).toFixed(1) + " x" + b.length : "none"}  frags ${diag.frags}  play ${diag.play || "pending"}`,
    `error ${diag.err || "none"}`, navigator.userAgent].join(String.fromCharCode(10));
}, 1000);

const sleep = ms => new Promise(r => setTimeout(r, ms));
const LIVE_SYNC = 3;   // hls.js starts this many segments back from the live edge

// Throws if the stream can't be reached. Otherwise waits until the media playlist holds
// LIVE_SYNC real segments: MediaMTX starts its HLS muxer only when someone asks, and pads a new
// muxer's playlist with #EXT-X-GAP placeholders; hls.js started then sits in the gap for good.
async function streamReady() {
  const r = await fetch(SRC, { cache: "no-store" });
  if (!r.ok) throw new Error(`playlist ${r.status}`);
  const variant = (await r.text()).split("\n").find(l => l.trim() && !l.startsWith("#"));
  if (!variant) return;
  const media = new URL(variant.trim(), r.url);
  for (let i = 0; i < 20; i++) {
    const m = await (await fetch(media, { cache: "no-store" })).text();
    const real = (m.match(/^#EXTINF/gm) || []).length - (m.match(/^#EXT-X-GAP/gm) || []).length;
    if (real >= LIVE_SYNC) return;
    say("Starting the camera…");
    await sleep(2000);
  }
}

let hlsNow = null;
async function start() {
  playing = false;
  diag.started = Date.now();
  // Check the stream ourselves first: with the Pi off, Discord's proxy answers 525 and
  // hls.js retries a 5xx quietly for minutes without telling the page.
  try {
    await streamReady();
  } catch (e) {
    showDown();
    setTimeout(start, 20000);
    return;
  }
  if (window.Hls && Hls.isSupported()) {
    // No worker: the Activity's content policy may not allow blob: workers.
    // Whole segments with a 3-segment cushion: low-latency parts (~0.3 s each, ~0.2 s
    // per request through Discord's proxy and the Funnel relay) kept stalling.
    const hls = hlsNow = new Hls({ enableWorker: false, lowLatencyMode: false, liveSyncDurationCount: LIVE_SYNC,
                                   manifestLoadingMaxRetry: 30, manifestLoadingRetryDelay: 2000 });
    hls.on(Hls.Events.FRAG_BUFFERED, () => { diag.frags++; });
    hls.on(Hls.Events.ERROR, (_, d) => {
      diag.err = `${d.details}${d.response && d.response.code ? " " + d.response.code : ""}${d.fatal ? " (fatal)" : ""}`;
      if (!d.fatal) return;
      if (playing) say("Reconnecting…");
      hls.destroy(); hls.dead = true; setTimeout(start, 3000);   // start() checks again and shows why if it's down
    });
    // backstop: a player that hasn't started 25 s in gets a fresh start
    setTimeout(() => { if (!playing && hlsNow === hls && !hls.dead) { hls.destroy(); hls.dead = true; start(); } }, 25000);
    hls.loadSource(SRC);
    hls.attachMedia(video);
  } else {
    video.src = SRC;  // Safari / iOS play HLS natively
    video.addEventListener("error", () => { showDown(); setTimeout(start, 20000); }, { once: true });
  }
  play();
}
start();
</script>
</body>
</html>
